# =============================================================
# CONFIGURAÇÃO DOS SITES - ROP Odds Mapping System
# =============================================================
# Preencha as URLs e seletores CSS de cada site.
# Use o inspetor do navegador (F12) para encontrar os seletores.
# =============================================================

main_site:
  name: "ROP/DP Sports"
  short_name: "ROP"
  url: "https://www.ropsolucoes.com"
  # O parâmetro de data será adicionado automaticamente: ?startTimeUtc=YYYY-MM-DD
  date_param: "startTimeUtc"
  selectors:
    # Seletores CSS para extrair dados da página
    event_container: ".event-card, .match-row, [data-testid='event']"
    home_team: ".home-team, .team-home"
    away_team: ".away-team, .team-away"
    odds_1x2: ".odds-1x2 .odd-value, .market-1x2 .odds"
    championship: ".league-name, .championship"
    match_time: ".match-time, .event-time"

