services:
  ropodds:
    build: .
    container_name: ropodds
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    volumes:
      - ropodds-data:/app/data
      - ropodds-logs:/app/logs
    environment:
      - TZ=America/Sao_Paulo

volumes:
  ropodds-data:
  ropodds-logs:
